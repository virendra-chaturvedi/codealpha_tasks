<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>To-Do List</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="style1.css" />
    <script>
        function addTask() {
            const input = document.getElementById("taskInput");
            const taskText = input.value.trim();

            if (taskText === "") return;

            const li = document.createElement("li");
            li.className = "list-group-item";
            li.innerHTML =
                '<div class="d-flex align-items-center w-100">'+
                '<input type="checkbox" class="form-check-input">' +
                '<span class="task-text">' + taskText + '</span>' +
                '<span class="delete-btn ms-auto" onclick="deleteTask(this)">&#10005;</span>' +
                '</div>';
            document.getElementById("taskList").appendChild(li);
            input.value = "";
        }
        function deleteTask(element) {
            element.closest("li").remove();
        }

    </script>
</head>

<body>

    <div class="container mt-5">
        <div class="todo-box mx-auto shadow p-4 rounded-4" style="max-width: 500px;">
            <h4 class="mb-3 fw-bold text-primary">To-Do List 📝</h4>

            <div class="input-group mb-4">
                <input type="text" id="taskInput" class="form-control rounded-start-pill" placeholder="Add your task">
                <button class="btn btn-danger rounded-end-pill px-4" onclick="addTask()">Add</button>
            </div>

            <ul id="taskList" class="list-group">
                <!-- Tasks will appear here -->
            </ul>
        </div>
    </div>

    <!-- <script src="script.js"></script> -->
</body>

</html>
