<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Music Player</title>
  <link href="css/bootstrap.css" rel="stylesheet"/>
  <link href="css/style.css" rel="stylesheet"/>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css" integrity="sha512-Evv84Mr4kqVGRNSgIGL/F/aIDqQb7xQ2vcrdIwxfjThSH8CSR7PBEakCr51Ck+w+/U6swU2Im1vVX0SVk9ABhg==" crossorigin="anonymous" referrerpolicy="no-referrer" />
</head>
<body>
  <div id="outer">
    <div id="box"></div>
    <marquee><b id="title">My Music Player</b></marquee>
    <audio src="music/music1.mp3" id="audio"></audio>
    <input type="range" id="progress" value="0" min="0" max="100">
    <div id="btn">
      <i class="fa-solid fa-backward fa-lg" id="fb" onclick="abackward()"></i>
      <i class="fa-solid fa-play fa-lg" id="pl" onclick="aplay()"></i>
      <i class="fa-solid fa-pause fa-lg" id="pa" onclick="apause()"></i>
      <i class="fa-solid fa-forward fa-lg" id="fw" onclick="aforward()"></i>
    </div>
  </div>

  <script src="js/script.js" rel="javascript"></script>
</body>
</html>
